<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
        layout:decorate="~{fragments/main.html}"
>
<head>
    <title>Game
        list</title>
</head>
<body>
    <div layout:fragment="page" class="card" style="padding:10px;margin-top: 1.5em;">
        <div class="card" id="GameListPage_card">
            <div class="card-header">
                <h3 class="card-title">
                    <strong>Game
                        list</strong>
                </h3>
                <div class="card-tools">
                    <button id="CreateGameButton" class="btn btn-sm btn-success">
                        <i class="fas fa-plus"></i> Crate new
                    </button>
                    <button ffw-type="DataTable.RefreshButton" ffw-target="GameListPage_table" class="btn btn-sm btn-primary">
                        <i class="fas fa-sync"></i>
                    </button>
                </div>
            </div>
            
            <div class="card-body">
                <form action="" id="GameListPage_form" method="post">
                    <table id="GameListPage_table" class="table table-striped">
                        <thead>
                        <tr>
                            <th>
                                Title
                            </th>
                            <th>
                                Map
                            </th>
                            <th>
                                Status
                            </th>
                            <th>
                                *
                            </th>
                        </tr>
                        </thead>
                    </table>
                </form>
            </div>
        </div>
        <script type="text/javascript" th:inline="javascript">
            $.fn.serializeObject = function () {
                var o = {};
                var a = this.serializeArray();
                $.each(a, function () {
                    if (o[this.name]) {
                        if (!o[this.name].push) {
                            o[this.name] = [o[this.name]];
                        }
                        o[this.name].push(this.value || '');
                    } else {
                        o[this.name] = this.value || '';
                    }
                });
                return o;
            };
            $(document).ready(function () {
                new DataTable('#GameListPage_table', {
                    lengthMenu: 100,
                    processing: true,
                    serverSide: false,
                    searching: true,
                    searchDelay: false,
                    autoWidth: false,
                    ajax: {
                        destroy: false,
                        dataSrc: '',
                        url:/*[[${@environment.getProperty(\'server.servlet.context-path\')+'/game/data/list'}]]*/ '??',
                        type: 'GET'
                    },
                    columns: [
                        {
                            data: 'title'
                        },
                        {
                            data: 'mapName',
                        },
                        {
                            data: 'status',
                        },
                        {
                            data: 'statusKey',
                            render: function (rowId, type, row, meta) {
                                return '<button ffw-type="JoinButton" ffw-session-key="' + row['sessionKey'] + '">Join</button>';
                            }
                        }
                    ],
                    columnDefs: [
                        {
                            targets: 0,
                            className: 'text-left',
                            bSortable: true
                        },
                        {
                            targets: 1,
                            className: 'text-left',
                            bSortable: true
                        },
                        {
                            targets: 2,
                            className: 'text-left',
                            bSortable: true
                        },
                        {
                            targets: 3,
                            className: 'menu-container',
                            bSortable: false
                        }
                    ],
                });
                
                
            });
            
            // $('#CreateGameButton').on('onSuccessResponse', 'button', function (event, data) {
            //     $('#GameListPage_table').DataTable().ajax.reload();
            // });
            
            // Refreshing table after row-menu action
            $('#GameListPage_table').on('onSuccessResponse', 'item', function (event, data) {
                $('#GameListPage_table').DataTable().ajax.reload();
            });
            $('#GameListPage_table').on('onErrorResponse', 'item', function (event, data) {
                $('#GameListPage_table').DataTable().ajax.reload();
            });
            $(document).on('click', '[ffw-type="JoinButton"]', function (e) {
                e.preventDefault();
                let self = this;
                try {
                    let ffwSessionKey = self.getAttribute("ffw-session-key");
                    if (ffwSessionKey == null) {
                        throw "The ffw-session-key is not defined!";
                    }
                    joinToAGameAndLoad(ffwSessionKey);
                } catch (exp) {
                    console.error(exp)
                }
            });
            
            
            
            
            
            $(document).on('click', '#CreateGameButton', function (e) {
                        e.preventDefault();
                        let self = this;
                        
                        try {
                            
                            $.ajax({
                                type: 'GET',
                                url: '/web/game/data/create',
                                dataType: 'json',
                                contentType: "application/json; charset=utf-8",
                                beforeSend: function (xhr) {
                                    let csrfToken = $("meta[name='_csrf']").attr("content");
                                    let csrfHeader = $("meta[name='_csrf_header']").attr("content");
                                    xhr.setRequestHeader(csrfHeader, csrfToken); // Include CSRF token in request headers
                                },
                                success: function (response) {
                                    $('#GameListPage_table').DataTable().ajax.reload();
                                },
                                error: function (xhr, status, error) {
                                    $('#GameListPage_table').DataTable().ajax.reload();
                                    console.error("Error:", error);
                                }
                            });
                            
                        } catch (exp) {
                            console.error(exp)
                        }
                    }
            );
            
            
            
            
            
            
            
        </script>
    
    
    </div>

</body>
</html>
