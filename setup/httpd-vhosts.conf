# 2️⃣ HTTPS → átirányítás a game subdomainre
<VirtualHost *:443>
    ServerName dominions.hu

    SSLEngine on
    SSLCertificateFile "C:/_services/apache/conf/ssl/dominions.hu.crt"
    SSLCertificateKeyFile "C:/_services/apache/conf/ssl/dominions.hu.key"

    # Ha wildcard certed van (*.dominions.hu), az még jobb
    # SSLCertificateFile "C:/_services/apache/conf/ssl/wildcard.dominions.hu.crt"
    # SSLCertificateKeyFile "C:/_services/apache/conf/ssl/wildcard.dominions.hu.key"

    Redirect permanent / https://game.dominions.hu/
</VirtualHost>



