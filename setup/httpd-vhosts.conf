



<VirtualHost *:443>
    ServerName game.dominions.hu
    DocumentRoot "C:/@/@Szakdolgozat1/_apps/Dominions/DominionsSiteFrontend/dist"

    <Directory "C:/@/@Szakdolgozat1/_apps/Dominions/DominionsSiteFrontend/dist">
        AllowOverride All
        Require all granted
    </Directory>

    SSLEngine on
    SSLCertificateFile "C:/_services/apache/conf/ssl/dominions.hu.crt"
    SSLCertificateKeyFile "C:/_services/apache/conf/ssl/dominions.hu.key"

    ProxyPreserveHost On




    RewriteEngine On
    # WebSocket upgrade feltétel
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]

    # WS-t WS-sel kell proxizálni!
    RewriteRule ^/api/(.*)  ws://api.dominions.hu/$1  [P,L]




    ProxyPass        "/api/"  "http://api.dominions.hu/"
    ProxyPassReverse "/api/"  "http://api.dominions.hu/"
	
	
	

	
	
	
	
	
	
  
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Ssl   "on"
</VirtualHost>











<VirtualHost *:443>
	ServerName admin.dominions.hu
	DocumentRoot "C:/@/@Szakdolgozat1/_apps/Dominions/DominionsAdminFrontend/dist"

	<Directory "C:/@/@Szakdolgozat1/_apps/Dominions/DominionsAdminFrontend/dist">
		AllowOverride All
		Require all granted
	</Directory>

	# HTTPS kapcsolathoz
	SSLEngine on
	
	# HTTPS hitelesio
    SSLCertificateFile "C:/_services/apache/conf/ssl/dominions.hu.crt"
    SSLCertificateKeyFile "C:/_services/apache/conf/ssl/dominions.hu.key"
	
	# Proxy SSL engine NEM KELL, mert HTTP-re proxizik, de ha a abackend https-ben futan akkor kellene
    # SSLProxyEngine On

    # Az API hívások továbbítása a backendre
    ProxyPreserveHost On
	
	# /api fallback eset, ha a bongeszoben probalkoznak
	<IfModule mod_rewrite.c>
        RewriteEngine On

        # Ha böngésző navigáció (Accept: text/html), ne menjen a backendhez
        RewriteCond %{REQUEST_URI} ^/api [NC]
        RewriteCond %{HTTP_ACCEPT} text/html [NC]
        RewriteRule ^ /index.html [L]
    </IfModule>
	
	
    # API hívások HTTP-re mennek, nem HTTPS-re
    ProxyPass /api http://api.dominions.hu/
    ProxyPassReverse /api http://api.dominions.hu/

    # (Opcionális, de ajánlott a CORS és WebSocket kompatibilitás miatt)
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Ssl on
</VirtualHost>




