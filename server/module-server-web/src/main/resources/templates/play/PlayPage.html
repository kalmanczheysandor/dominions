<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org"

        layout:decorate="~{fragments/main.html}"
>
<head>
    <title>Login</title>
    <style>
        
        .container-fluid {
            padding: 0px;
        }
        
        svg {
            height: 738px;
            /*width: 1597px;*/
            width: 1620px;
            display: flex;
            
            background-color: #005ce6;
            margin: 0px;
            padding: 0px;
        }
        
        input {
            border-radius: 3px;
            padding: 2px;
        }
        
        
        #ExitButton {
            position: absolute;
            top: 0px;
            right: 0px;
            bottom: 0px;
            width: 150px;
            box-sizing: border-box;
            padding: 10px;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            
        }
        
        #TargetInput, #TroopsInput {
            
            width: 150px;
            box-sizing: border-box;
            padding: 10px;
            
            color: white;
            font-size: 20px;
            font-weight: bold;
            
            background-color: transparent;
            border: 1px white solid;
            border-radius: 4px;
        }
        
        
        #TargetInput:focus, #TroopsInput:focus {
            outline: none;
        }
        
        
        #AttackButton, #ReserveButton {
            width: 150px;
            box-sizing: border-box;
            padding: 10px;
            
            color: white;
            font-size: 20px;
            font-weight: bold;
        }
        
        #AttackButton {
            background-color: #ff0000;
        }
        
        #AttackButton:hover {
            background-color: #cc0000;
        }
        
        
        #ReserveButton {
            background-color: #00cc44;
        }
        
        #ReserveButton:hover {
            background-color: #00802b;
        }
        
        #ActionBox {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        
        #PlayersPanel {
            position: absolute;
            top: 10px;
            right: 10px;
        }
        
        #PlayersPanel table {
            border-collapse: separate;
            border-spacing: 0 5px;
        }
        
        #PlayersPanel td {
            color: white;
            padding: 2px 10px 2px 10px;
            backdrop-filter: blur(100px);
        }
        
        .CountryLabel {
            color: white;
            font-size: 15px;
            font-weight: bold;
        }
        
        #CellIndex {
            position: absolute;
            left: 5px;
            top: 5px;
            color: white;
            font-size: 25px;
            font-weight: bold;
        }
        
        #TurnLabel {
            position: absolute;
            left: 5px;
            top: 5px;
            color: white;
            font-size: 25px;
            font-weight: bold;
        }
    
    </style>


</head>

    <nav layout:fragment="menu" class="navbar navbar-expand sticky-top navbar-dark ffw-bg-blue" style="height:60px;position:relative;">

        </div>
        <a id="ExitButton" class="btn btn-basic " style="" href="#">EXIT</a>
        
        <div id="TurnLabel"></div>
    </nav>

                            let self = this;
                            try {
                                let ffwCountryKey = self.getAttribute("ffw-country-key");
                                if (ffwCountryKey == null) {
                                    throw "The ffw-country-key is not defined!";
                                }
                                
                                selectCountryAsTarget(ffwCountryKey);
                                
                            } catch (exp) {
                                console.error(exp)
                            }
                        }
                );
                
                $(document).on('click', '#AttackButton', function (e) {
                            e.preventDefault();
                            let self = this;
                            
                            
                            let pathData = getUrlPathData();
                            let playerIndex = pathData.playerIndex;
                            let sessionKey = pathData.sessionKey;
                            
                            try {
                                
                                $.ajax({
                                    type: 'POST',
                                    url: '/web/map/'+sessionKey+'/play/'+playerIndex+'/step',  // Replace with your server endpoint
                                    dataType: 'json',  // Expected data type from the server
                                    contentType: "application/json; charset=utf-8",  // Type of data being sent
                                    data: JSON.stringify({
                                        targetCellKey: document.getElementById('TargetInput').value,
                                        attackingTroopSize: document.getElementById('TroopsInput').value
                                    }),
                                    beforeSend: function (xhr) {
                                        let csrfToken = $("meta[name='_csrf']").attr("content");
                                        let csrfHeader = $("meta[name='_csrf_header']").attr("content");
                                        xhr.setRequestHeader(csrfHeader, csrfToken); // Include CSRF token in request headers
                                    },
                                    success: function (response) {
                                        refreshState(response)
                                        document.getElementById('TargetInput').value = '';
                                        document.getElementById('TroopsInput').value = '';
                                    },
                                    error: function (response) {
                                        const errorResponse = JSON.parse(response);
                                        // Handle error
                                        console.error("Error:", errorResponse);
                                        console.error(errorResponse);
                                        alert("PlayerKey:"+errorResponse.playerKey);
                                    }
                                });
                                
                            } catch (exp) {
                                console.error(exp)
                            }
                        }
                );
                
                
                let pathData = getUrlPathData();
                let playerIndex = pathData.playerIndex;
                let sessionKey = pathData.sessionKey;
                
                loadState(sessionKey);
                // console.log("PATH:" + window.location.pathname);
                // console.log("playerIndex:" + playerIndex);
                // console.log("sessionKey:" + sessionKey);
                
                setInterval(function() {
                    console.log("reload");
                    loadState(sessionKey)
                }, 1000);
            });
        
        
        </script>
    
    </div>

</body>
</html>
