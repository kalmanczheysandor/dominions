server:
  port: 7022
  servlet:
    context-path: '/ai-2'

spring:
  application:
    name: 'ai-2'



  config:
    import: 'optional:configserver:'

eureka:
  client:
    serviceUrl:
      defaultZone: 'http://localhost:7001/eureka'

management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

logging:
  pattern:
    level: '%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]'