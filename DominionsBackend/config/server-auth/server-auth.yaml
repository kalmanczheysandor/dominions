            concurrency: 2
      rabbit:
        bindings:

          test-out-0:
            producer:
              routingKeyExpression: '''my-test-key'''
          myTest-in-0:
            consumer:
              bindingRoutingKey: '''my-test-key'''
              queue-name-group-only: true
      binders:
        rabbit:
          type: rabbit
          environment:
            spring:
              rabbitmq:
                host: localhost
                port: 5672
                username: guest
                password: guest
