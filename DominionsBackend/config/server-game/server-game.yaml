server:
  port: 15020
spring:
  config:
    import:
      - ${global.paths.config-repo}/common/eureka.yaml
      - ${global.paths.config-repo}/common/tracing.yaml
      - ${global.paths.config-repo}/common/monitoring.yaml
      - ${global.paths.config-repo}/common/logging.yaml
      - ${global.paths.config-repo}/common/db.yaml
      - ${global.paths.config-repo}/common/session.yaml
#      - ${global.paths.config-repo}/common/upload.yaml
      - ${global.paths.config-repo}/common/configuration-bus-client.yaml
  cloud:
    stream:
      bindings:
        queueHistoryBroadcast-out-0:
          destination: history-broadcast-main
          contentType: application/json
        queueHistory-out-0:
          destination: history-exchange-main
        queueHistory-in-0:
          destination: history-exchange-main
          group: history-queue
          consumer:
            concurrency: 10
            queueName: history-queue
      rabbit:
        bindings:
          queueHistoryBroadcast-out-0:
            producer:
              exchangeType: topic
              routingKey: x-route
          queueHistory-out-0:
            producer:
              routingKey: route-main
              exchangeType: direct
          #              persistentDeliveryMode: true
          queueHistory-in-0:
            consumer:
              bindingRoutingKey: route-main
              exchangeType: direct
              acknowledgeMode: AUTO
      binders:
        rabbit:
          type: rabbit
          environment:
            spring:
              rabbitmq:
                host: ${global.monitoring.rabbitmq.host}
                port: ${global.monitoring.rabbitmq.port}
                username: ${global.monitoring.rabbitmq.username}
                password: ${global.monitoring.rabbitmq.password}
                virtual-host: ${global.monitoring.rabbitmq.virtual-host}
debug: true
