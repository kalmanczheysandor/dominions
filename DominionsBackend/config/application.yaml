

global:
  paths:
    config-repo: file:/config
  monitoring:
    rabbitmq:
      host: CHANGE_ME
      port: 5672
      username: admin
      password: CHANGE_ME
      virtual-host: /
app:
  test:
    x: 545
  global:
    images-folder: "CHANGE_ME/images"

  game-server:
    session-management:
      expirationHours: 1

  liz-server:
    neural-network:
      base-folder: "CHANGE_ME/ai/liz"

  site-server:
    account:
      sign-up:
        verificationExpirationMinutes: 60
      recovery:
        verificationExpirationMinutes: 5
      settings:
        profile:
          photo-path: "${app.global.images-folder}/site-user/profile"
    game-scenario:
      main-image-path: "${app.global.images-folder}/game/scenario"

  admin-server:
      account:
        site:
          user:
            photo-path: "${app.global.images-folder}/site-user/profile"
        admin:
          user:
            photo-path: "${app.global.images-folder}/admin-user/profile"
          settings:
            profile:
              photo-path: "${app.global.images-folder}/admin-user/profile"
      game-scenario:
        main-image-path: "${app.global.images-folder}/game/scenario"