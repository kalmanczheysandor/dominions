services:

  server-config:
    build: ../server-config
    ports:
      - "8888:8888"
    env_file:
      - ../.env
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx512m"
    volumes:
      - ${CENTRAL_CONFIG_REPO_PATH}:/config
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8888/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10

  server-gateway:
    build: ../server-gateway
    ports:
      - "15000:15000"
    env_file:
      - ../.env
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx512m"
    depends_on:
      server-config:
        condition: service_healthy



  server-eureka:
    build: ../server-eureka
    ports:
      - "15001:15001"
    env_file:
      - ../.env
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx512m"
    depends_on:
      server-config:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:15001/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10



  server-auth:
    build: ../server-auth
    ports:
      - "15002:15002"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ../.env
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx512m"
    depends_on:
      server-config:
        condition: service_healthy

  server-site:
    build: ../server-site
    ports:
      - "15009:15009"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ../.env
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx512m"
    volumes:
      - ${HOST_GLOBAL_DATA_FOLDER}:${APP_GLOBAL_DATA_FOLDER}
    depends_on:
      server-config:
        condition: service_healthy
  #
  server-admin:
    build: ../server-admin
    ports:
      - "15010:15010"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ../.env
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx512m"
    volumes:
      - ${HOST_GLOBAL_DATA_FOLDER}:${APP_GLOBAL_DATA_FOLDER}
    depends_on:
      server-config:
        condition: service_healthy

  server-game:
    build: ../server-game
    ports:
      - "15020:15020"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ../.env
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx512m"
    depends_on:
      server-config:
        condition: service_healthy

