<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
	  layout:decorate="~{fragments/frame.html}"
>
	<head>
	</head>
	<body>
		<div layout:fragment="container" >
			<nav layout:fragment="menu" class="navbar navbar-expand sticky-top navbar-dark ffw-bg-blue">
				<div class="container-fluid">
					<a class="navbar-brand" href="#">DOMINIONS</a>
					
					<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarScroll" aria-controls="navbarScroll" aria-expanded="false" aria-label="Toggle navigation">
						<span class="navbar-toggler-icon"></span>
					</button>
					
					<div class="collapse navbar-collapse" id="navbarScroll">
						<ul class="navbar-nav me-auto my-lg-0 navbar-nav-scroll" style="--bs-scroll-height: 100px;">
							<li class="nav-item">
								<a class="nav-link active" aria-current="page" th:href="${@environment.getProperty('server.servlet.context-path')+'/dashboard'}">Dashboard</a>
							</li>
							<li class="nav-item">
								<a class="nav-link active" aria-current="page" th:href="${@environment.getProperty('server.servlet.context-path')+'/game'}">Game</a>
							</li>
							
							
							<li class="nav-item">
								<a class="nav-link active" aria-current="page" th:href="${@environment.getProperty('server.servlet.context-path')+'/user'}">Users</a>
							</li>
							
							<li class="nav-item">
								<a class="nav-link active" aria-current="page" th:href="${@environment.getProperty('server.servlet.context-path')+'/game'}">Game</a>
							</li>
							
							
							<li class="nav-item">
								<a class="nav-link active" aria-current="page" href="#">Home</a>
							</li>
							<li class="nav-item">
								<a class="nav-link" href="#">Link</a>
							</li>
							<li class="nav-item dropdown">
								<a class="nav-link dropdown-toggle" href="#" id="navbarScrollingDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
									Link
								</a>
								<ul class="dropdown-menu" aria-labelledby="navbarScrollingDropdown">
									<li><a class="dropdown-item" href="#">Action</a></li>
									<li><a class="dropdown-item" href="#">Another action</a></li>
									<li>
										<hr class="dropdown-divider">
									</li>
									<li><a class="dropdown-item" href="#">Something else here</a></li>
								</ul>
							</li>
							<li class="nav-item">
								<a class="nav-link disabled" href="#" tabindex="-1" aria-disabled="true">Link</a>
							</li>
						</ul>
						<form class="d-flex">
							<input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
							<button class="btn btn-outline-success" type="submit">Search</button>
						</form>
						
						
						<form th:action="${@environment.getProperty('server.servlet.context-path')+'/logout'}" method="post" class="d-flex" sec:authorize="isAuthenticated()">
							<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
							<button type="submit" class="btn btn-alert">Logout</button>
						</form>
					</div>
				</div>
			</nav>
			<div class="container-fluid">
				<span layout:fragment="page" class="card" style="margin-top: 1.5em;">[page]</span>
			</div>
		</div>
	</body>
</html>
